<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18121f">
  <meta name="description" content="Find your kind of spark among Rizzora's virtual AI companions.">
  <title>Find Your Spark | Rizzora</title>
  <link rel="stylesheet" href="portal.css?v=chris-living-room-20261119">
  <link rel="stylesheet" href="find-your-spark.css?v=20261119">
  <script src="characters.js?v=20261119" defer></script>
  <script src="find-your-spark.js?v=20261119" defer></script>
</head>
<body class="spark-page">
  <a class="skip-link" href="#spark-main">Skip to content</a>
  <header class="spark-header">
    <a class="wordmark" href="index.html#home" aria-label="Rizzora home"><img src="assets/logo.svg" alt="" width="28" height="28">rizzora<span>®</span></a>
    <a class="spark-back" href="index.html#find-your-spark"><img class="icon" src="assets/arrow.svg" alt="">Back</a>
    <button class="spark-shortlist" type="button" id="open-shortlist" aria-label="View shortlist"><img class="icon" src="assets/heart.svg" alt=""><span id="saved-count">0</span></button>
  </header>
  <main id="spark-main" class="spark-main">
    <section id="swipe-view" aria-labelledby="spark-title">
      <div class="spark-heading"><h1 id="spark-title">Who catches your eye?</h1></div>
      <div class="spark-progress"><span id="card-count"></span><progress id="discovery-progress" value="0" max="4" aria-label="Companions reviewed"></progress></div>
      <div class="spark-deck" id="spark-deck" aria-label="Companion selection"></div>
      <div class="spark-controls" role="group" aria-label="Companion choices">
        <button class="spark-action spark-undo" id="undo-choice" type="button" title="Undo last choice" aria-label="Undo last choice" disabled><img class="icon" src="assets/undo.svg" alt=""></button>
        <button class="spark-action spark-pass" id="pass-choice" type="button" title="Pass" aria-label="Pass"><img class="icon" src="assets/close.svg" alt=""></button>
        <button class="spark-action spark-like" id="like-choice" type="button" title="Interested" aria-label="Interested"><img class="icon" src="assets/heart.svg" alt=""></button>
      </div>
      <a class="spark-browse" href="index.html#discover">Browse all companions<img class="icon" src="assets/arrow.svg" alt=""></a>
    </section>
    <section id="shortlist-view" class="spark-results" aria-labelledby="shortlist-title" hidden>
      <div class="spark-heading"><p class="eyebrow">A LITTLE CLOSER TO YOUR KIND</p><h1 id="shortlist-title">Your sparks.</h1><p id="shortlist-summary"></p></div>
      <div class="spark-results-grid" id="shortlist-cards"></div>
      <div class="spark-empty" id="shortlist-empty" hidden><img src="assets/heart.svg" alt="" width="40" height="40"><p>No sparks yet.</p></div>
      <div class="spark-result-actions">
        <button class="button button-primary" type="button" id="continue-discovery">Keep exploring<img class="icon" src="assets/arrow.svg" alt=""></button>
        <button class="text-link" type="button" id="undo-result"><img class="icon" src="assets/undo.svg" alt="">Undo last choice</button>
        <button class="text-link" type="button" id="restart-discovery"><img class="icon" src="assets/undo.svg" alt="">Start again</button>
        <a class="text-link" href="index.html#discover">Browse all<img class="icon" src="assets/arrow.svg" alt=""></a>
      </div>
    </section>
    <p id="spark-status" class="spark-sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
